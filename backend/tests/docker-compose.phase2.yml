services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PHASE2_DB_NAME:?PHASE2_DB_NAME is required}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PHASE2_BOOTSTRAP_PASSWORD:?PHASE2_BOOTSTRAP_PASSWORD is required}
      APP_DB_NAME: ${PHASE2_DB_NAME:?PHASE2_DB_NAME is required}
      APP_DB_USER: ${PHASE2_DB_USER:?PHASE2_DB_USER is required}
      APP_DB_PASSWORD: ${PHASE2_DB_PASSWORD:?PHASE2_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${PHASE2_DB_PORT:?PHASE2_DB_PORT is required}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../docker/postgres-init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PHASE2_DB_USER:?PHASE2_DB_USER is required} -d ${PHASE2_DB_NAME:?PHASE2_DB_NAME is required}",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
