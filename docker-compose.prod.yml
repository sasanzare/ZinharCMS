services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_prod}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      APP_DB_NAME: ${POSTGRES_DB:-cms_prod}
      APP_DB_USER: ${POSTGRES_APP_USER:-cms_user}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER:-cms_user} -d ${POSTGRES_DB:-cms_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_KEY_RING: ${JWT_KEY_RING:?JWT_KEY_RING is required}
      MFA_ENCRYPTION_KEY_RING: ${MFA_ENCRYPTION_KEY_RING:?MFA_ENCRYPTION_KEY_RING is required}
      MFA_ISSUER: ${MFA_ISSUER:-ZinharCMS}
      MFA_ENROLLMENT_TTL_SECONDS: ${MFA_ENROLLMENT_TTL_SECONDS:-600}
      MFA_PRE_AUTH_TTL_SECONDS: ${MFA_PRE_AUTH_TTL_SECONDS:-300}
      MFA_STEP_UP_TTL_SECONDS: ${MFA_STEP_UP_TTL_SECONDS:-300}
      MFA_RATE_LIMIT_MAX_ATTEMPTS: ${MFA_RATE_LIMIT_MAX_ATTEMPTS:-5}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-3600}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PREVIEW_WS_ALLOWED_ORIGINS: ${PREVIEW_WS_ALLOWED_ORIGINS:?PREVIEW_WS_ALLOWED_ORIGINS is required}
      PREVIEW_TICKET_TTL_SECONDS: ${PREVIEW_TICKET_TTL_SECONDS:-30}
      PREVIEW_TICKET_RATE_LIMIT_PER_MINUTE: ${PREVIEW_TICKET_RATE_LIMIT_PER_MINUTE:-30}
      PREVIEW_REVALIDATION_INTERVAL_SECONDS: ${PREVIEW_REVALIDATION_INTERVAL_SECONDS:-30}
      SECURITY_CLEANUP_BATCH_SIZE: ${SECURITY_CLEANUP_BATCH_SIZE:-500}
      EXPIRED_SESSION_RETENTION_DAYS: ${EXPIRED_SESSION_RETENTION_DAYS:-30}
      REVOKED_SESSION_RETENTION_DAYS: ${REVOKED_SESSION_RETENTION_DAYS:-30}
      COMPROMISED_SESSION_RETENTION_DAYS: ${COMPROMISED_SESSION_RETENTION_DAYS:-180}
      SECURITY_TOKEN_RETENTION_DAYS: ${SECURITY_TOKEN_RETENTION_DAYS:-7}
      SECURITY_AUDIT_RETENTION_DAYS: ${SECURITY_AUDIT_RETENTION_DAYS:-365}
      LOGIN_ATTEMPT_RETENTION_DAYS: ${LOGIN_ATTEMPT_RETENTION_DAYS:-30}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RUST_LOG: ${RUST_LOG:-info}
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    ports:
      - "5173:80"
    environment:
      CSP_API_ORIGIN: ${CSP_API_ORIGIN:?CSP_API_ORIGIN is required}
      CSP_WEBSOCKET_ORIGIN: ${CSP_WEBSOCKET_ORIGIN:?CSP_WEBSOCKET_ORIGIN is required}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads:
